name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Only registry-authenticate on pushes; PRs from forks have no write token.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: ${{ github.event_name == 'push' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke -p 3030:3030 "$IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3030/hello && break
            sleep 1
          done
          test "$(curl -fsS http://localhost:3030/hello)" = "Hello world"
          docker rm -f smoke

  deploy:
    name: Deploy to local Ubuntu
    # Runs on the self-hosted runner inside WSL, so no inbound access,
    # SSH key or password is involved — the runner reaches out to GitHub.
    runs-on: [self-hosted, linux, wsl-ubuntu]
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-local
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Deploy
        env:
          PORT: "3030"
          COMPOSE_PROJECT_NAME: ci-cd-linux
        run: ./scripts/deploy.sh
