services:
  app:
    build:
      context: .
      target: runtime
    image: ci-cd-linux:local
    container_name: ci-cd-linux
    ports:
      - "${PORT:-3030}:3030"
    environment:
      NODE_ENV: production
      PORT: 3030
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3030/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
